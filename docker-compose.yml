version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cineai-platform:latest
    container_name: cineai-app
    ports:
      - "8080:8080"
    volumes:
      - cineai_data:/app/data
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DATABASE_URL=/app/data/cineai.db
      - JWT_SECRET=supersecret_cineai_production_key_9824
      - TMDB_API_KEY=4e44d9029b1270a757cddc766a1bcb63
    restart: unless-stopped

volumes:
  cineai_data:
