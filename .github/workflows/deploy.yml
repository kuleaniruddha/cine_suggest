name: Build & Validate CineAI Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install Backend Dependencies & Validate
      run: |
        cd backend
        npm install
        node -e "require('./services/catalog'); console.log('Backend Catalog OK');"

    - name: Install Frontend Dependencies & Compile Build
      run: |
        cd frontend
        npm install
        npm run build

    - name: Set up Python for Big Data Pipeline
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Machine Learning Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r dataset/requirements.txt

    - name: Test Docker Container Build
      run: |
        docker compose build
